spring:
  application:
    name: tech-test
  datasource:
    url: jdbc:h2:mem:tech-test;MODE=PostgreSQL;
    username: username
    password: password
    driverClassName: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

# H2 Console - visit http://localhost:8080/h2-console
  h2:
    console:
      enabled: true
      path: /h2-console