# This workflow will build a Java project
# For more information see: https://docs.github.com/en/actions/tutorials/build-and-test-code/java-with-maven

name: Java

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'
      - name: Build & Test
        run: sh mvnw verify