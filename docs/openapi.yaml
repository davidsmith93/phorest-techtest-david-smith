openapi: 3.2.0
info:
  title: Technical Test
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /api/machines/{id}/spins:
    parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
      - name: x-version
        in: header
        schema:
          type: number
          value: 1
        required: true
    post:
      requestBody:
        content:
          application/json:
      responses:
        "200":
          description: A successful spin including the column results and the outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineSpinResult'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    MachineSpinResult:
      properties:
        slots:
          type: array
          items:
            type: string
            examples:
              - BLACK
              - WHITE
              - GREEN
              - YELLOW
        outcome:
          type: string
          enum:
            - JACKPOT
            - FULL_HOUSE
            - SMALL_PRIZE
            - LOSS
        payoutInPence:
          type: number
        balanceInPence:
          type: number
        freeSpinsAwarded:
          type: number
    ErrorResponse:
      properties:
        code:
          type: string
        message:
          type: string
        errors:
          type: array
          elements:
            type: object
            properties:
              code:
                type: string
              message:
                type: string
